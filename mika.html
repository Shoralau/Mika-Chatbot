<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika Chatbot</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet" href="mika.css">
</head>
<body>
    <button id="chatbot-toggler">
        <span class="material-symbols-rounded">mode_comment</span>
        <span class="material-symbols-rounded">close</span>
    </button>

    <div class="chatbot-popup">
        <div class="chat-header">
            <div class="space"></div>
            <div class="header-info">
                <h2 class="logo-text"><span>Mika </span>Chatbot</h2>
            </div>
            <button id="close-chatbot" class="material-symbols-rounded">close_small</button>
        </div>

        <div class="scroll-margin">
            <div class="chat-body">
                <div class="message bot-message">
                    <svg class="bot-avatar" width="40" height="40" viewBox="0 0 1024 1024"><image href="logo Undika.png"></svg>
                    <div class="message-text">Selamat datang, ada yang bisa dibantu?</div>
                </div>
            </div>
        </div>

        <div class="chat-footer">
            <form action="#" class="chat-form">
                <textarea placeholder="Ketik disini..." class="message-input" required></textarea>
                <div class="chat-controls">
                    <button type="submit" id="send-message" class="material-symbols-rounded">arrow_upward</button>
                </div>
            </form>
        </div>
    </div>

    <script src="Mika.js"></script>
</body>
</html>
